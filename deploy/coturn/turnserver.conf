# coturn configuration for NYK Support Portal.
#
# coturn is the TURN relay: when two peers cannot connect directly (strict
# NAT/firewall), their encrypted media is relayed through here. The server
# issues short-lived credentials signed with the shared secret below, so there
# are no per-user TURN passwords to manage.
#
# Install on Ubuntu:   sudo apt-get install -y coturn
# Enable the service:  set TURNSERVER_ENABLED=1 in /etc/default/coturn
# Then copy this file to /etc/turnserver.conf and `systemctl restart coturn`.

# The public hostname clients will reach. Must resolve to this VPS.
realm=turn.CHANGE-ME.example.com
server-name=turn.CHANGE-ME.example.com

# Listen for STUN/TURN on the standard port (UDP + TCP).
listening-port=3478

# TLS TURN (turns:) on 5349. Point these at the same certificate your domain
# uses (e.g. the Let's Encrypt files, or a copy the server writes). Optional but
# recommended so TURN works even on networks that only allow TLS/443-like
# traffic.
tls-listening-port=5349
# cert=/etc/letsencrypt/live/turn.CHANGE-ME.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.CHANGE-ME.example.com/privkey.pem

# Relay port range. Open these UDP ports in the firewall (see deploy README).
min-port=49160
max-port=49200

# --- authentication ---
# Time-limited credentials signed with a shared secret (coturn "REST API"
# scheme). This MUST match the server's -turn-secret / NYK_TURN_SECRET.
use-auth-secret
static-auth-secret=CHANGE-ME-LONG-RANDOM-SECRET

# --- hardening ---
# Deny relaying to private/loopback ranges to prevent the relay being abused to
# reach internal services.
no-cli
no-tlsv1
no-tlsv1_1
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Logging
log-file=/var/log/turnserver.log
simple-log

# If this VPS is behind a 1:1 NAT (cloud provider gives a private primary IP and
# a separate public IP), uncomment and set these:
# external-ip=PUBLIC_IP/PRIVATE_IP
